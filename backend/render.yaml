# Render Blueprint — SmokeStack ERP backend (API web service + managed Postgres).
# This is a SEPARATE service from the existing static web app; it does not touch it.
databases:
  - name: smokestack-db
    plan: basic-256mb          # scale up as records grow
    postgresMajorVersion: "16"

services:
  - type: web
    name: smokestack-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head      # run migrations before new code serves
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"       # pin a stable runtime; avoid Python 3.14 wheel gaps
      - key: DATABASE_URL
        fromDatabase:
          name: smokestack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        value: https://smokestack-erp.onrender.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"             # SECURITY (SEC HIGH-02 / LOW-12): exactly ONE proxy we operate
                               # (Render's router) sits in front of this service, so the
                               # RIGHTMOST X-Forwarded-For entry is the address that router
                               # observed and the only one an attacker cannot forge. The code
                               # default is 0 (ignore the header, trust the socket peer), which
                               # is the SAFE default but the WRONG one here: behind the router
                               # every request would attribute to the router itself, collapsing
                               # the per-IP rate limit into ONE shared bucket for the entire
                               # customer base. This value must never exceed the number of
                               # proxies actually in the path. Kept identical to the root
                               # render.yaml, which defines the same service.
      - key: SEED_ON_START
        value: "false"         # SECURITY: production must never seed demo/default accounts.
                               # The DB is already seeded; the code also defaults this to
                               # false for non-SQLite (prod) stores as a second safety net.
